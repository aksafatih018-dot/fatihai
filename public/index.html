
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>FatihAi - AI Assistant</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">Fatih<span>Ai</span></div>
      <button class="new-chat" id="newChat">+ Chat Baru</button>
      <h4>RIWAYAT CHAT</h4>
      <div id="history"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <strong>FatihAi Assistant</strong>
        <span class="status">● UI ONLINE</span>
      </header>

      <section class="chat-container">
        <div class="welcome" id="welcome">
          <h1>Halo, selamat datang di <span>FatihAi</span></h1>
          <p>Asisten AI untuk belajar, coding, menulis, dan berkreasi.</p>
        </div>

        <div id="messages"></div>

        <form class="composer" id="chatForm">
          <textarea id="messageInput" placeholder="Tanyakan sesuatu kepada FatihAi..." required></textarea>
          <button type="submit">➤</button>
        </form>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
